---
# SPDX-License-Identifier: GPL-3.0-only

# a staged install reports ok on re-runs, so ask rpm (by provides) if it is live
- name: Check whether the packages are live on a transactional update system
  command:  # noqa command-instead-of-module
    argv: "{{ ['rpm', '-q', '--whatprovides'] + __rsyslog_tu_packages }}"
  register: __logging_packages_live
  changed_when: false
  failed_when: false
  check_mode: false
  when: __rsyslog_tu_packages | length > 0

- name: Handle reboot for transactional update systems
  when: __rsyslog_tu_result is changed or
    (__logging_packages_live.rc | d(0)) != 0
  block:
    - name: Notify user that reboot is needed to apply changes
      debug:
        msg: >
          Reboot required to apply changes due to transactional updates.

    - name: Reboot transactional update systems
      reboot:
        msg: Rebooting the system to apply transactional update changes.
      when:
        - logging_transactional_update_reboot_ok is not none
        - logging_transactional_update_reboot_ok | bool

    - name: Fail if reboot is needed and not set
      fail:
        msg: >
          Reboot is required but not allowed. Please set 'logging_transactional_update_reboot_ok' to proceed.
      when:
        - logging_transactional_update_reboot_ok is none
