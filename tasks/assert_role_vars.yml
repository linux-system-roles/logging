---
- name: Assert logging_max_message_size is greater than 1024
  ansible.builtin.assert:
    that:
      - logging_max_message_size | int > 1024
    fail_msg: >-
      logging_max_message_size must be greater than 1024,
      got {{ logging_max_message_size }}
  when: logging_max_message_size is defined

- name: Assert server_host in logging_outputs is a string or list of strings
  ansible.builtin.assert:
    that:
      - >-
        item.server_host is string
        or (item.server_host is sequence and item.server_host is not mapping
            and item.server_host | reject('string') | list | length == 0)
    fail_msg: >-
      logging_outputs[{{ idx }}].server_host must be a string or list of
      strings, got {{ item.server_host | type_debug }}
  loop: "{{ logging_outputs }}"
  loop_control:
    index_var: idx
    label: "{{ item.name | d('unnamed') }}"
  when: item.server_host is defined

- name: Assert owner in logging_outputs is a string or integer
  ansible.builtin.assert:
    that:
      - >-
        item.owner is string
        or (item.owner | type_debug) == 'int'
    fail_msg: >-
