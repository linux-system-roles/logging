---
- name: Manage SELinux settings
  when:
    - logging_manage_selinux | bool
    - logging_tcp_ports | length > 0 or logging_udp_ports | length > 0 or
      logging_tls_tcp_ports | length > 0 or logging_tls_udp_ports | length > 0
  block:
    - name: Initialize logging_selinux_ports
      set_fact:
        logging_selinux_ports: []

    - name: Add non tls tcp ports to logging_selinux_ports
      set_fact:
        logging_selinux_ports: "{{ logging_selinux_ports |
          union([{'ports': item, 'proto': 'tcp',
                  'setype': 'syslogd_port_t',
                  'state': 'present',
                  'local': 'true'}]) }}"
      loop: "{{ logging_tcp_ports }}"

    - name: Add tls tcp ports to logging_selinux_ports
      set_fact:
        logging_selinux_ports: "{{ logging_selinux_ports |
          union([{'ports': item, 'proto': 'tcp',
                  'setype': 'syslog_tls_port_t',
                  'state': 'present',
                  'local': 'true'}]) }}"
      loop: "{{ logging_tls_tcp_ports }}"

    - name: Add non tls udp ports to logging_selinux_ports
      set_fact:
        logging_selinux_ports: "{{ logging_selinux_ports |
          union([{'ports': item, 'proto': 'udp',
                  'setype': 'syslogd_port_t',
                  'state': 'present',
                  'local': 'true'}]) }}"
      loop: "{{ logging_udp_ports }}"

    - name: Add tls udp ports to logging_selinux_ports
      set_fact:
        logging_selinux_ports: "{{ logging_selinux_ports |
          union([{'ports': item, 'proto': 'udp',
                  'setype': 'syslog_tls_port_t',
                  'state': 'present',
                  'local': 'true'}]) }}"
      loop: "{{ logging_tls_udp_ports }}"

    - name: Ensure packages needed to manage selinux ports are installed
      package:
        name: "{{ __logging_selinux_packages }}"
        state: present
      when: __logging_selinux_packages | length > 0
      register: __logging_selinux_package_result

    - name: Handle reboot for transactional update systems
      include_role:
        name: "{{ role_path }}/roles/rsyslog"  # noqa role-name[path]
        tasks_from: transactional_reboot.yml
      vars:
        __rsyslog_tu_result: "{{ __logging_selinux_package_result }}"
        __rsyslog_tu_packages: "{{ __logging_selinux_packages }}"
      when:
        - __logging_is_transactional
        - __logging_selinux_packages | length > 0

    - name: Manage selinux for specified ports
      include_role:
        name: fedora.linux_system_roles.selinux
      vars:
        selinux_ports: "{{ logging_selinux_ports }}"
      when: logging_selinux_ports | d([]) | length > 0
